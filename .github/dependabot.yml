
# ============================================================
# Reactily · Lily Studios
# Continuous Integration
# ============================================================

name: Reactily CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Reactily Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Setup Rokit
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Validate Reactily
        run: npm test

  website:
    name: Reactily Website
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: reactily-website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: reactily-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate website
        run: npm run verify
