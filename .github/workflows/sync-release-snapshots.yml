name: Sync Reactily Release Documentation

on:
  push:
    branches: [main]
    paths:
      - "reactily-website/scripts/sync-release-snapshots.mjs"
      - ".github/workflows/sync-release-snapshots.yml"
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: reactily-release-snapshot-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Archive Tagged Documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Generate and verify version snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node reactily-website/scripts/sync-release-snapshots.mjs

      - name: Commit snapshots and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reactily-website/public/version-snapshots/
          if git diff --cached --quiet; then
            echo "Release archives unchanged."
            exit 0
          fi
          git commit -m "docs: archive immutable release documentation"
          git pull --rebase origin main
          git push origin main
          gh workflow run deploy.yml --ref main
