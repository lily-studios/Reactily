
name: Reactily CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Reactily Core
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.0"
          cache: npm

      - uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Validate Reactily
        run: npm test

  website:
    name: Reactily Website
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: reactily-website

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: reactily-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate website
        run: npm run verify
